name: E2E (manual)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://wildworld.example.org

      - name: Run E2E
        run: npx playwright test --project=chromium
        env:
          ADMIN_PASSWORD: ci-test-password-not-production
          ADMIN_SESSION_SECRET: ci-test-session-secret-32-characters-minimum
          NEXT_PUBLIC_SITE_URL: https://wildworld.example.org

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
