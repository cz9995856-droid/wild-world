name: News sync

# 每天 UTC 02:00 同步 RSS 快照并推送回 cf-pages。
# 注意：GitHub 定时任务只在默认分支生效，且长期不活跃的仓库会被自动暂停，
# 需定期在 Actions 页确认；站点同时支持运行时超过 12 小时自动重抓 RSS 作为兜底。
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cf-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync RSS news
        env:
          NEWS_USER_AGENT: ${{ secrets.NEWS_USER_AGENT || 'WILDWORLD-Museum/1.0 (+https://wild-world-museum.pages.dev)' }}
          NEWS_SYNC_MAX_ITEMS: "120"
        run: npm run sync:news

      - name: Commit and push snapshot
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add public/data/news-snapshot.json
          if git diff --cached --quiet; then
            echo "新闻无变化，跳过提交"
          else
            git commit -m "chore(wildchina): scheduled news sync"
            git push origin HEAD:cf-pages
          fi

      - name: Trigger Cloudflare Pages deploy (optional)
        if: ${{ secrets.CF_PAGES_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsS -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}" || echo "部署钩子调用失败，请检查 Cloudflare Pages 配置"