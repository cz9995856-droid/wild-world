name: Pages smoke test

on:
  push:
    branches: [cf-pages]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAGES_URL: https://wild-world-museum.pages.dev

    steps:
      - name: Check Pages home
        run: curl -fsS --max-time 60 "$PAGES_URL/" | grep -o "WILD WORLD" | head -1

      - name: Check Pages search API proxy
        run: curl -fsS --max-time 60 "$PAGES_URL/api/search?q=%E9%9B%AA%E8%B1%B9" | grep -o '"results"' | head -1

      - name: Check Pages media asset
        run: curl -fsSI --max-time 60 "$PAGES_URL/media/hero/hero-01.jpg" | grep -i "content-type" | head -1

      - name: Check Pages species detail
        run: curl -fsS --max-time 60 "$PAGES_URL/encyclopedia/giant-panda" | grep -o "大熊猫" | head -1

      - name: Check Pages admin page
        id: admin
        continue-on-error: true
        run: |
          code=$(curl -sS -L -o /tmp/admin.html -w '%{http_code}' --max-time 60 "$PAGES_URL/admin")
          echo "status=$code" > cloudflare/admin-check.log
          echo "url=$PAGES_URL/admin" >> cloudflare/admin-check.log
          head -c 800 /tmp/admin.html >> cloudflare/admin-check.log
          echo "status=$code"
          test "$code" = "200"

      - name: Publish admin diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B cf-debug-admin
          git add -f cloudflare/admin-check.log
          git commit -m "ci: admin page status" || true
          git push -f origin cf-debug-admin || true

      - name: Check Pages map page
        if: steps.admin.outcome == 'success'
        run: curl -fsS --max-time 60 "$PAGES_URL/map" | grep -o "全球动物地图" | head -1