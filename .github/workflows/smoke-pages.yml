name: Pages smoke test

on:
  push:
    branches: [cf-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAGES_URL: https://wild-world-museum.pages.dev

    steps:
      - name: Check Pages home
        run: curl -fsS --max-time 60 "$PAGES_URL/" | grep -o "WILD WORLD" | head -1

      - name: Check Pages search API proxy
        run: curl -fsS --max-time 60 "$PAGES_URL/api/search?q=%E9%9B%AA%E8%B1%B9" | grep -o '"results"' | head -1

      - name: Check Pages media asset
        run: curl -fsSI --max-time 60 "$PAGES_URL/media/hero/hero-01.jpg" | grep -i "content-type" | head -1

      - name: Check Pages species detail
        run: curl -fsS --max-time 60 "$PAGES_URL/encyclopedia/giant-panda" | grep -o "大熊猫" | head -1

      - name: Check Pages admin page
        run: test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$PAGES_URL/admin")" = "200"

      - name: Check Pages map page
        run: curl -fsS --max-time 60 "$PAGES_URL/map" | grep -o "全球动物地图" | head -1