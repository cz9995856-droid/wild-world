name: News sync

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cf-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync RSS news
        env:
          NEWS_USER_AGENT: ${{ secrets.NEWS_USER_AGENT || 'WILDWORLD-Museum/1.0 (+https://wild-world-museum.pages.dev)' }}
          NEWS_SYNC_MAX_ITEMS: "120"
        run: npm run sync:news

      - name: Commit and push snapshot
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add public/data/news-snapshot.json
          if git diff --cached --quiet; then
            echo "新闻无变化，跳过提交"
          else
            git commit -m "chore(wildchina): scheduled news sync"
            git push origin HEAD:cf-pages
          fi